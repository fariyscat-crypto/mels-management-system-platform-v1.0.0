version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mels-platform-app
    container_name: mels-platform-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mels_local
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      FILESYSTEM_DRIVER: s3
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: mels-storage
      AWS_ENDPOINT: http://localstack:4566
    depends_on:
      - db
      - redis
      - localstack
    ports:
      - '9000:9000'

  web:
    image: nginx:alpine
    container_name: mels-platform-web
    depends_on:
      - app
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '8080:80'

  db:
    image: postgres:16
    container_name: mels-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mels_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: mels-platform-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  localstack:
    image: localstack/localstack:2.2
    container_name: mels-platform-localstack
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      DATA_DIR: /tmp/localstack/data

volumes:
  db_data:
