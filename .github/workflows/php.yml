name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mels_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: 8.4
          extensions: mbstring, bcmath, xml, curl, zip, pgsql, pdo_pgsql, intl
      - name: Validate composer
        run: composer --version
      - name: Install dependencies
        run: composer install --no-progress --no-suggest
      - name: Copy environment file
        run: cp .env.example .env
      - name: Generate app key
        run: php artisan key:generate --ansi
      - name: Set database env
        run: |
          php -r "file_put_contents('.env', str_replace([
            'DB_DATABASE=mels_local',
            'DB_USERNAME=postgres',
            'DB_PASSWORD=secret'
          ], [
            'DB_DATABASE=mels_test',
            'DB_USERNAME=postgres',
            'DB_PASSWORD=secret'
          ], file_get_contents('.env')));"
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run tests
        run: php artisan test --no-tty
